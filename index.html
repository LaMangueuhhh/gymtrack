<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <title>GymTrack</title>
  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" data-act="back" aria-label="Retour" hidden>‹</button>
    <h1 id="title">GymTrack</h1>
    <button class="icon-btn" data-act="go" data-to="#/reglages" aria-label="Réglages">⚙︎</button>
  </header>

  <main id="app"></main>

  <a id="liveBar" class="live-bar" href="#/live" hidden><span class="pulse"></span><span class="grow ellipsis" id="liveBarText"></span><b>Reprendre ›</b></a>

  <div id="restTimer" class="rest-timer" hidden>
    <span>Repos</span>
    <strong id="restTime">1:30</strong>
    <button data-act="rest-add">+15 s</button>
    <button data-act="rest-stop">Stop</button>
  </div>

  <nav class="tabbar">
    <a href="#/accueil" data-tab="accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></a>
    <a href="#/entrainer" data-tab="entrainer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>Entraîner</span></a>
    <a href="#/defi" data-tab="defi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4.4 0 7-2.9 7-6.8 0-3.6-2.4-6.1-4.3-8.2-.4 2-1.4 3.4-2.9 4.1C12 8 10.6 5 8.3 2.5 8 6.5 5 9.2 5 14.6 5 19.1 7.6 22 12 22z"/><path d="M12 22c-1.8 0-3-1.3-3-3 0-2 1.6-3 2.4-4.6.9 1 1.3 1.9 1.4 2.8.6-.4 1-1 1.2-1.6 1 1.1 1 2.2 1 3.4 0 1.7-1.2 3-3 3z"/></svg><span>Défi</span></a>
    <a href="#/progres" data-tab="progres"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="m4 15 5-5 4 4 7-7"/><path d="M15 7h5v5"/></svg><span>Progrès</span></a>
    <a href="#/nutrition" data-tab="nutrition"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2.2 1.2-3 3.7-3 7v4h3"/></svg><span>Nutrition</span></a>
    <a href="#/corps" data-tab="corps"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M5 8.5h14M12 8.5V14m0 0-3.5 7M12 14l3.5 7"/></svg><span>Corps</span></a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-act="close-modal" aria-label="Fermer">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="data.js?v=13"></script>
  <script src="seances.js?v=13"></script>
  <script src="data-extra.js?v=13"></script>
  <script src="alternatives.js?v=13"></script>

  <script src="foods.js?v=13"></script>
  <script src="app.js?v=13"></script>

</html>
