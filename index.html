<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <title>GymTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" data-act="back" aria-label="Retour" hidden>‹</button>
    <h1 id="title">GymTrack</h1>
    <button class="icon-btn" data-act="go" data-to="#/reglages" aria-label="Réglages">⚙︎</button>
  </header>

  <main id="app"></main>

  <div id="restTimer" class="rest-timer" hidden>
    <span>Repos</span>
    <strong id="restTime">1:30</strong>
    <button data-act="rest-add">+15 s</button>
    <button data-act="rest-stop">Stop</button>
  </div>

  <nav class="tabbar">
    <a href="#/accueil" data-tab="accueil"><span>🏠</span>Accueil</a>
    <a href="#/agenda" data-tab="agenda"><span>📅</span>Agenda</a>
    <a href="#/progres" data-tab="progres"><span>📈</span>Progrès</a>
    <a href="#/exos" data-tab="exos"><span>📖</span>Exos</a>
    <a href="#/nutrition" data-tab="nutrition"><span>🍽️</span>Nutrition</a>
    <a href="#/corps" data-tab="corps"><span>📏</span>Corps</a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-act="close-modal" aria-label="Fermer">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="data.js"></script>
  <script src="data-extra.js"></script>
  <script src="bodymap.js"></script>
  <script src="foods.js"></script>
  <script src="app.js"></script>
</body>
</html>
